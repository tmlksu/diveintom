# Music Mood Analyzer Configuration

# Analysis settings
analysis:
  # Use LLM for mood interpretation
  use_llm: true

  # Use source separation for instrument/vocal analysis
  # Note: Source separation is computationally expensive
  use_separation: true

  # Default time per lyric line in seconds (null = auto-calculate)
  time_per_line: null

# LLM settings
llm:
  # Provider to use: "claude" or "gemini"
  provider: "gemini"

  # Model to use for analysis
  # Claude options: claude-3-5-haiku-20241022 (fast, cheap), claude-3-5-sonnet-20241022 (better quality)
  # Gemini options: google/gemini-2.0-flash-001:free (free tier), google/gemini-pro (paid)
  model: null  # Uses provider default if not specified

  # API key (can also be set via ANTHROPIC_API_KEY or OPENROUTER_API_KEY env var)
  api_key: null

# Output settings
output:
  # Default output format
  format: "json"  # or "yaml"

  # Include null values in output
  include_null: false

# Audio processing settings
audio:
  # Sample rate for audio processing (Hz)
  sample_rate: 22050
